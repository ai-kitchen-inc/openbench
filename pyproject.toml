[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench"
dynamic = ["version"]
description = "The Open Source Agentic AI Workbench - Build. Orchestrate. Export. Scale."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenBench Contributors", email = "openbench2026@gmail.com"}
]
keywords = [
    "ai",
    "agents",
    "agentic-ai",
    "workflow",
    "llm",
    "data-processing",
    "automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
]

data = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "sqlalchemy>=2.0.0",
    "chromadb>=0.4.0",
    "pypdf>=4.0.0",
]

intelligence = [
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.8.0",
]

google = [
    "google-generativeai>=0.8.0",
    "google-genai>=1.0.0",
]

search = [
    "tavily-python>=0.3.0",
    "google-search-results>=2.4.0",
    "ddgs>=6.0.0",
]

output = [
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",
    "python-pptx>=0.6.21",
    "reportlab>=4.0.0",
]

security = [
    "cryptography>=41.0.0",
]

vector = [
    "pinecone-client>=3.0.0",
]

gdrive = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
]

gcp = [
    "google-cloud-storage>=2.16.0",
    "google-cloud-pubsub>=2.20.0",
    "psycopg[binary]>=3.1.0",
]

firebase = [
    "firebase-admin>=6.0.0",
]

extraction = [
    "langextract>=1.0.0",
]

epub = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
]

media = [
    "pillow>=10.0.0",
    "pillow-heif>=0.16.0",
    "cairosvg>=2.7.0",
    "imageio-ffmpeg>=0.5.0",
]

chat = [
    "fastapi>=0.100.0",
    "uvicorn>=0.25.0",
    "ag-ui-protocol>=0.1.0",
]

mcp = [
    "mcp[cli]>=1,<2",
    "httpx>=0.27",
    "opentelemetry-api>=1.24",
]

all = [
    "openbench[dev,data,intelligence,output,security,google,vector,search,extraction,epub,media,chat,mcp,gcp]"
]

[project.urls]
Homepage = "https://github.com/ai-kitchen-inc/openbench"
Documentation = "https://github.com/ai-kitchen-inc/openbench/tree/main/docs"
Repository = "https://github.com/ai-kitchen-inc/openbench"
Issues = "https://github.com/ai-kitchen-inc/openbench/issues"

[project.scripts]
openbench = "openbench.cli.main:cli"

[tool.setuptools.dynamic]
version = {attr = "openbench._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbench = [
    "py.typed",
    "skills/*/SKILL.md",
    "skills/*/tools.py",
    "skills/*/references/*.md",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "C4",   # flake8-comprehensions
    "PERF", # perflint (performance)
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in argument defaults
    "RUF012",  # mutable class attributes — not using ClassVar pattern in this project
    "RUF022",  # unsorted __all__ — intentional grouping by category
    "PERF203", # try-except in loop — intentional for per-item error handling
]

[tool.ruff.lint.isort]
known-first-party = ["openbench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = false
# SDK skills are loaded at runtime via importlib.util.spec_from_file_location
# with unique module names. mypy's static module resolver sees the multiple
# `tools.py` files as duplicates, which isn't meaningful for runtime behavior.
exclude = [
    "src/openbench/skills/",
]

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "google.*",
    "pinecone.*",
    "e2b.*",
    "autogen.*",
    "langextract.*",
    "tavily.*",
    "ag_ui.*",
    "mcp.*",
    "yaml.*",
]
ignore_missing_imports = true

# Adapters and stores use lazy-init pattern (self.client = None, assigned in connect/init)
[[tool.mypy.overrides]]
module = [
    "openbench.adapters.*",
    "openbench.data.stores.pinecone",
]
disable_error_code = ["union-attr", "attr-defined", "assignment"]

# Chainable generics: Input/Output variance is by-design in composition operators
[[tool.mypy.overrides]]
module = "openbench.core.chainable"
disable_error_code = ["return-value"]

# L2 layers use NotRequired (Python 3.11+) and heterogeneous layer lists
[[tool.mypy.overrides]]
module = [
    "openbench.core.layers",
    "openbench.chat.layer",
]
disable_error_code = ["attr-defined", "arg-type", "assignment"]

# Intelligence modules: lazy-init clients, execute() signature evolution, dynamic attrs
[[tool.mypy.overrides]]
module = [
    "openbench.intelligence.base",
    "openbench.intelligence.agents",
    "openbench.intelligence.llm_providers",
    "openbench.intelligence.embeddings",
    "openbench.intelligence.planning",
]
disable_error_code = ["assignment", "override", "attr-defined", "arg-type", "misc"]

# Data sources: optional model params (str | None), lazy clients
[[tool.mypy.overrides]]
module = [
    "openbench.data.sources.grounded_search",
    "openbench.data.sources.langextract",
]
disable_error_code = ["arg-type", "union-attr", "misc"]

# Lazy-init pattern in core providers and chat transport
[[tool.mypy.overrides]]
module = [
    "openbench.core.providers",
    "openbench.chat.transport.agui.*",
]
disable_error_code = ["assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
markers = [
    "integration: end-to-end tests that exercise the full FastAPI/agent stack (slower)",
    "slow: tests that take a noticeable amount of wall-clock time",
    "unit: fast, isolated unit tests (the default; marker is optional)",
]

[tool.coverage.run]
branch = true
source = ["openbench"]
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Floor set just below the measured ~74% line coverage. Ratchet upward as
# coverage improves; keep it under the real number so unrelated PRs don't
# fail CI on noise.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
