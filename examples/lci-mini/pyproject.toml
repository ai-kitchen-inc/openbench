[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lci-mini"
version = "0.1.0"
description = "Minimal LCI consultant assistant — demonstrates OpenBench Persona + Skill Layers"
requires-python = ">=3.10"
dependencies = [
    "openbench",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    # XQL skill dependencies (Excel-as-RDBMS)
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# NOTE: soul/ and skills/ are project-root directories, NOT inside
# src/lci_mini/. For editable installs (`pip install -e .`) the files
# are already on disk. For non-editable installs or Docker builds, use
# MANIFEST.in or copy these directories into the container alongside
# the package. setuptools package-data paths are relative to the
# package dir (src/lci_mini/) so "../soul/*.md" only works in editable
# mode — we keep it for dev convenience but document the limitation.
[tool.setuptools.package-data]
lci_mini = [
    "../soul/*.md",
    "../skills/*/SKILL.md",
    "../skills/*/tools.py",
    "../skills/*/references/*.md",
    "../skills/*/config/*.yaml",
]
