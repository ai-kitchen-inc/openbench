mcp:
  policy:
    allow_remote_servers: false
    allowed_servers:
      - db_server
    # connect_to_database lets the model repoint the server at any reachable
    # database; the image also disables it (MCP_ALLOW_DYNAMIC_CONNECT unset),
    # this is the registry-side belt to that brace.
    denied_tools:
      - db_server.connect_to_database
      # Arbitrary SQL chosen by the model (and so by any prompt injection) is
      # off by default. Writes the product needs go through the typed tools
      # (materialize_query, insert/update/delete), which MCP_ALLOW_WRITES gates.
      # Set MCP_DB_DENIED_WRITE_TOOL to an empty value in .env.gcp to re-enable.
      - ${MCP_DB_DENIED_WRITE_TOOL:-db_server.execute_unsafe_sql}
    max_timeout_seconds: 60

  servers:
    db_server:
      transport: stdio
      command: docker
      args:
        - run
        - "--rm"
        - "-i"
        - "-e"
        - DATABASE_URL=${MCP_DB_DATABASE_URL}
        - "-e"
        - MCP_ALLOW_WRITES=${MCP_ALLOW_WRITES}
        - "-e"
        - MCP_MAX_ROWS=${MCP_MAX_ROWS}
        - us-central1-docker.pkg.dev/sss-poc1-corporate/openbench/mcp-db-server:1.3.1-ob3
      namespace: db_server
      allowed: true
      discovery_timeout_seconds: 15
      timeout_seconds: 60
      retries: 0
