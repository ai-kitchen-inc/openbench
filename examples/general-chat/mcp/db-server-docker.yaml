mcp:
  policy:
    allow_remote_servers: false
    allowed_servers:
      - db_server
    max_timeout_seconds: 60

  servers:
    db_server:
      transport: stdio
      command: docker
      args:
        - run
        - "--rm"
        - "-i"
        - "-v"
        - "${MCP_DB_DATA_PATH}:/data"
        - "-e"
        - DATABASE_URL=sqlite+aiosqlite:////data/default.db
        - souhardyak/mcp-db-server:1.3.1
      namespace: db_server
      allowed: true
      discovery_timeout_seconds: 15
      timeout_seconds: 60
      retries: 0
