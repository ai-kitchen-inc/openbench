mcp:
  policy:
    allow_remote_servers: false
    allowed_servers:
      - db_server
    max_timeout_seconds: 60

  servers:
    db_server:
      transport: stdio
      command: docker
      args:
        - run
        - "--rm"
        - "-i"
        - "-e"
        - DATABASE_URL=${MCP_DB_DATABASE_URL}
        - "-e"
        - MCP_ALLOW_WRITES=${MCP_ALLOW_WRITES}
        - "-e"
        - MCP_MAX_ROWS=${MCP_MAX_ROWS}
        - us-central1-docker.pkg.dev/sss-poc1-corporate/openbench/mcp-db-server:1.3.1-ob1
      namespace: db_server
      allowed: true
      discovery_timeout_seconds: 15
      timeout_seconds: 60
      retries: 0
