mcp:
  policy:
    allow_remote_servers: false
    allowed_servers:
      - dashboard_generator
      - aggregate_data
    max_timeout_seconds: 30

  servers:
    aggregate_data:
      transport: stdio
      command: ${AGGREGATE_DATA_MCP_PYTHON:-python}
      args:
        - -m
        - app.mcp_server
        - --transport
        - stdio
      cwd: ../../mcp/aggregate-data-mcp
      env:
        PYTHONPATH: ${AGGREGATE_DATA_MCP_PYTHONPATH}
        OPENBENCH_DASHBOARD_STATE_PATH: ${OPENBENCH_DASHBOARD_STATE_PATH:-../../examples/general-chat/.openbench/dashboard_generator_state.json}
      namespace: aggregate_data
      allowed: true
      discovery_timeout_seconds: 20
      timeout_seconds: 30
      retries: 0

    dashboard_generator:
      transport: stdio
      command: ${DASHBOARD_GENERATOR_MCP_PYTHON:-python}
      args:
        - -m
        - app.mcp_server
        - --transport
        - stdio
      cwd: ../../mcp/dashboard-generator-mcp
      env:
        PYTHONPATH: ${DASHBOARD_GENERATOR_MCP_PYTHONPATH}
        OPENBENCH_EXPORT_DIR: ${OPENBENCH_EXPORT_DIR}
        OPENBENCH_EXPORT_URL_BASE: ${OPENBENCH_EXPORT_URL_BASE:-/downloads}
        # Shared with the API so out-of-process dashboard links are signed too.
        OPENBENCH_DOWNLOAD_SECRET: ${OPENBENCH_DOWNLOAD_SECRET:-}
        OPENBENCH_DOWNLOAD_TTL_SECONDS: ${OPENBENCH_DOWNLOAD_TTL_SECONDS:-}
        OPENBENCH_DASHBOARD_STATE_PATH: ${OPENBENCH_DASHBOARD_STATE_PATH:-../../examples/general-chat/.openbench/dashboard_generator_state.json}
        DASHBOARD_RENDER_ADAPTER: ${DASHBOARD_RENDER_ADAPTER:-default}
        STITCH_API_KEY: ${STITCH_API_KEY:-}
        STITCH_API_URL: ${STITCH_API_URL:-}
      namespace: dashboard_generator
      allowed: true
      discovery_timeout_seconds: 20
      timeout_seconds: 30
      retries: 0
