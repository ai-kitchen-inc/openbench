mcp:
  server:
    name: openbench-image-search
    include_sdk_tools: false
    skills:
      - examples/image-search-mcp/openbench-skill
    transport: stdio
    policy:
      allowed_servers:
        - openbench-image-search
      require_approval_for_risks:
        - write
        - artifact_write
        - external_network
        - destructive
