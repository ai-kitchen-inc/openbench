mcp:
  server:
    name: openbench-generic-api
    include_sdk_tools: false
    skills:
      - examples/generic-api-mcp/openbench-skill
    transport: stdio
    policy:
      allowed_servers:
        - openbench-generic-api
      require_approval_for_risks:
        - write
        - artifact_write
        - external_network
        - destructive

