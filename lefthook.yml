pre-commit:
  parallel: true
  commands:
    biome:
      root: "studio/chat-ui/"
      glob: "*.{ts,tsx,js,jsx}"
      run: npx @biomejs/biome check --write {staged_files}
      stage_fixed: true
    ruff-check:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
