server {
    server_name chat.serebrum.co.id;

    client_max_body_size 30m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # AG-UI SSE stream — must not be buffered or the chat will not stream.
    location /awp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat/upload {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chat/uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    # Grafana under a subpath. No trailing slash on proxy_pass so the /grafana
    # prefix is preserved (Grafana runs with serve_from_sub_path=true).
    # WebSocket upgrade headers cover Grafana Live.
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/chat.serebrum.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.serebrum.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = chat.serebrum.co.id) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name chat.serebrum.co.id;
    return 404;
}

# 34-135-198-188.sslip.io is retired — refuse the connection outright.
# The block must exist: without it, SNI fallback would serve the app
# from the chat.serebrum.co.id server (its cert SANs cover this name).
server {
    listen 443 ssl;
    server_name 34-135-198-188.sslip.io;
    ssl_certificate /etc/letsencrypt/live/chat.serebrum.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.serebrum.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 444;
}

server {
    listen 80;
    server_name 34-135-198-188.sslip.io;
    return 444;
}
