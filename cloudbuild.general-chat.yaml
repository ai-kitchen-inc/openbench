# Firebase web config (public, not secret) is baked into the SPA bundle.
# deploy.sh passes the substitutions from the frontend .env.production.
#
# machineType/timeout mirror cloudbuild.controlled-source-chat.yaml: the
# default worker is 2 vCPU, and this image compiles the torch/docling stack
# and runs two Vite builds.
#
# Do NOT swap this for kaniko --cache=true. It was tried (build
# c6755ac8-316b-4f90-9898-b48c7098f42c) and died with exit 137 (OOM) after
# 12 min: kaniko snapshots the whole filesystem after every RUN layer and
# this image (torch + docling + Playwright Chromium) does not fit in
# E2_HIGHCPU_8's 8 GB. Layer caching here needs the Dockerfile reordered
# first (see "Build speed" in deploy/DEPLOY.md) — caching a layer chain that
# `COPY . /app` invalidates on every source edit buys almost nothing anyway.
substitutions:
  _VITE_FIREBASE_API_KEY: ""
  _VITE_FIREBASE_AUTH_DOMAIN: ""
  _VITE_FIREBASE_PROJECT_ID: ""
  _VITE_FIREBASE_APP_ID: ""
timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.general-chat
      - --build-arg
      - VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg
      - VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg
      - VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - -t
      - us-central1-docker.pkg.dev/sss-poc1-corporate/openbench/general-chat:latest
      - .
images:
  - us-central1-docker.pkg.dev/sss-poc1-corporate/openbench/general-chat:latest
